name: CrowdForge quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: python scripts/serve.py > /tmp/crowdforge-server.log 2>&1 &
      - name: Await health
        run: python scripts/wait_for_server.py
      - run: npm run test:e2e
      - run: python scripts/replay.py artifacts/e2e-replay.json
      - run: python benchmarks/run.py
      - run: python benchmarks/competition.py
      - run: python scripts/measure_sync.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/
            benchmarks/results.json
            benchmarks/competition-results.json
            test-results/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and launch Compose
        run: |
          cp .env.example .env
          docker compose -p crowdforge-ci up --build -d
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/wait_for_server.py
      - run: python scripts/container_smoke.py
      - run: docker compose -p crowdforge-ci restart crowdforge
      - run: python scripts/wait_for_server.py
      - name: Verify persisted evidence after restart
        run: >-
          docker compose -p crowdforge-ci exec -T crowdforge python -c
          "import os,sqlite3; db=sqlite3.connect(os.environ['DATABASE_PATH']); count=db.execute('SELECT COUNT(*) FROM rounds WHERE seed=7731 AND outcome=\"paused\"').fetchone()[0]; assert count >= 1; print('SQLite evidence survived Compose restart')"
      - name: Clean up isolated test deployment
        if: always()
        run: docker compose -p crowdforge-ci down --volumes
